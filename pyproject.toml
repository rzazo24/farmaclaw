[project]
name = "farmaclaw"
version = "0.1.0"
description = "Servidores MCP de research farmacéutico (CIMA, PubMed)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruamel-yaml>=0.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "red: llama a APIs externas (CIMA, NCBI, e-lactancia); saltar con -m 'not red'",
]
